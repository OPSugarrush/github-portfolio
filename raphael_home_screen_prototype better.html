<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raphael — home screen mockup</title>
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f1efe8;
    --surface-0: #e8e6de;
    --card-bg: #f5f4ef;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --text-accent: #185fa5;
    --bg-accent: #e6f1fb;
    --text-accent-dark: #0c447c;
    --border: #d3d1c7;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--surface-0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .phone-frame {
    width: 340px;
    background: var(--surface-1);
    border-radius: 28px;
    padding: 12px;
    border: 0.5px solid var(--border);
  }

  .screen {
    background: var(--surface-2);
    border-radius: 20px;
    padding: 20px 18px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .app-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .badge {
    background: var(--bg-accent);
    color: var(--text-accent-dark);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: var(--radius);
  }

  .greeting {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .card-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 6px;
  }

  .card-value-lg {
    font-size: 28px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0;
  }

  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .stat-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 4px;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0;
  }

  .macro-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .macro-title {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 12px;
  }

  .macro-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .macro-row:last-child { margin-bottom: 0; }

  .macro-label {
    font-size: 12px;
    color: var(--text-secondary);
    width: 52px;
    flex-shrink: 0;
  }

  .macro-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .macro-fill {
    height: 100%;
    background: var(--text-accent);
  }

  .macro-value {
    font-size: 12px;
    color: var(--text-secondary);
    width: 38px;
    text-align: right;
    flex-shrink: 0;
  }

  .nav-row {
    display: flex;
    justify-content: space-around;
    border-top: 0.5px solid var(--border);
    padding-top: 14px;
  }

  .nav-icon {
    color: var(--text-muted);
  }

  .nav-icon.active {
    color: var(--text-accent);
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="screen">

    <div class="header-row">
      <span class="app-name">Raphael</span>
      <span class="badge">prototype</span>
    </div>

    <p class="greeting">Good morning</p>
    <p class="subtitle">Here's your week</p>

    <div class="card">
      <p class="card-label">Food budget left this week</p>
      <p class="card-value-lg">$87.40</p>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <p class="stat-label">Saving this week</p>
        <p class="stat-value">$40.00</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Weekly income</p>
        <p class="stat-value">$692.31</p>
      </div>
    </div>

    <div class="macro-card">
      <p class="macro-title">Macro targets</p>

      <div class="macro-row">
        <span class="macro-label">Protein</span>
        <div class="macro-track"><div class="macro-fill" style="width:65%"></div></div>
        <span class="macro-value">120g</span>
      </div>
      <div class="macro-row">
        <span class="macro-label">Carbs</span>
        <div class="macro-track"><div class="macro-fill" style="width:45%"></div></div>
        <span class="macro-value">180g</span>
      </div>
      <div class="macro-row">
        <span class="macro-label">Fat</span>
        <div class="macro-track"><div class="macro-fill" style="width:55%"></div></div>
        <span class="macro-value">60g</span>
      </div>
    </div>

    <div class="nav-row">
      <svg class="nav-icon active" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-8 9 8" />
        <path d="M5 10v10h14V10" />
      </svg>
      <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20V10M12 20V4M20 20v-7" />
      </svg>
      <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M3 10h18M8 3v4M16 3v4" />
      </svg>
      <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
      </svg>
    </div>

  </div>
</div>

</body>
</html>
